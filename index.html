<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Industrial Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #menu {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 999;
        display: flex;
        gap: 8px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #menu button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background: #2E3235;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        opacity: 0.75;
        transition: opacity 0.15s;
      }
      #menu button:hover { opacity: 1; }
      #menu button.activo {
        background: #FFC400;
        color: #1A1A1A;
        opacity: 1;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <!-- ==================== MENÚ DE NAVEGACIÓN ==================== -->
    <div id="menu">
      <button id="btn-demo" class="activo" onclick="mostrarVista('demo')">Demo base</button>
      <button id="btn-partec" onclick="mostrarVista('partec')">Parte C</button>
      <button id="btn-parted" onclick="mostrarVista('parted')">Parte D</button>
    </div>

    <a-scene fog="type: linear; color: #B8C4CC; near: 15; far: 40">

      <!-- ==================== ILUMINACIÓN COMÚN ==================== -->
      <a-entity light="type: ambient; intensity: 0.55; color: #FFFFFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.9; color: #FFF6E0" position="4 8 4"></a-entity>

      <!-- ==================== VISTA 1: DEMO BASE (código original de la guía) ==================== -->
      <a-entity id="vista-demo" visible="true">
        <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>
        <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
        <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
        <a-sky color="#ECECEC"></a-sky>
      </a-entity>

      <!-- ==================== VISTA 2: PARTE C - MODELO INDUSTRIAL CON PRIMITIVAS ==================== -->
      <a-entity id="vista-partec" visible="false">

        <a-sky color="#B8C4CC"></a-sky>

        <a-entity id="piso-planta">
          <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="16"
            height="16"
            color="#5B5F63"
            material="roughness: 0.95; metalness: 0.1">
          </a-plane>

          <a-entity id="franjas-seguridad" position="0 0.005 -1.5" rotation="-90 0 0">
            <a-plane position="-2.6 -1.2 0" width="0.3" height="4.5" color="#FFC400"></a-plane>
            <a-plane position="-2.6 -1.2 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
            <a-plane position="-2.6 0.3 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
            <a-plane position="-2.6 -2.5 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
            <a-plane position="2.6 -1.2 0" width="0.3" height="4.5" color="#FFC400"></a-plane>
            <a-plane position="2.6 -1.2 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
            <a-plane position="2.6 0.3 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
            <a-plane position="2.6 -2.5 0" width="0.3" height="0.5" color="#1A1A1A"></a-plane>
          </a-entity>
        </a-entity>

        <a-entity id="paredes">
          <a-plane position="0 3 -7" width="16" height="6" color="#8C9296"></a-plane>
          <a-plane position="-8 3 0" rotation="0 90 0" width="14" height="6" color="#8C9296"></a-plane>
          <a-box position="0 0.3 -6.95" width="16" height="0.6" depth="0.05" color="#2E3235"></a-box>
        </a-entity>

        <a-entity id="tanque-principal" position="-2.5 0 -3.5">
          <a-cylinder position="-0.55 0.3 -0.55" radius="0.06" height="0.6" color="#2E3235"></a-cylinder>
          <a-cylinder position="0.55 0.3 -0.55" radius="0.06" height="0.6" color="#2E3235"></a-cylinder>
          <a-cylinder position="-0.55 0.3 0.55" radius="0.06" height="0.6" color="#2E3235"></a-cylinder>
          <a-cylinder position="0.55 0.3 0.55" radius="0.06" height="0.6" color="#2E3235"></a-cylinder>

          <a-cylinder position="0 2.1 0" radius="0.9" height="3" color="#1E6FA8" metalness="0.35" roughness="0.5"></a-cylinder>
          <a-cylinder position="0 3.65 0" radius="0.85" height="0.15" color="#144E78"></a-cylinder>
          <a-cylinder position="0 3.55 0" radius="0.9" height="0.1" color="#144E78"></a-cylinder>
          <a-cylinder position="0 1.4 0" radius="0.92" height="0.15" color="#0D3B5C"></a-cylinder>

          <a-cylinder position="1.0 1.8 0.25" radius="0.02" height="2.6" color="#3A3A3A"></a-cylinder>
          <a-cylinder position="1.0 1.8 -0.25" radius="0.02" height="2.6" color="#3A3A3A"></a-cylinder>
          <a-box position="1.0 1.0 0" width="0.02" height="0.03" depth="0.55" color="#3A3A3A"></a-box>
          <a-box position="1.0 1.4 0" width="0.02" height="0.03" depth="0.55" color="#3A3A3A"></a-box>
          <a-box position="1.0 1.8 0" width="0.02" height="0.03" depth="0.55" color="#3A3A3A"></a-box>
          <a-box position="1.0 2.2 0" width="0.02" height="0.03" depth="0.55" color="#3A3A3A"></a-box>
          <a-box position="1.0 2.6 0" width="0.02" height="0.03" depth="0.55" color="#3A3A3A"></a-box>

          <a-cylinder position="0 3.8 0" radius="0.08" height="0.3" color="#C0392B"></a-cylinder>
          <a-box position="0 3.95 0" width="0.3" height="0.04" depth="0.04" color="#C0392B"></a-box>
          <a-box position="0 3.95 0" width="0.04" height="0.04" depth="0.3" color="#C0392B"></a-box>
        </a-entity>

        <a-entity id="tanque-secundario" position="-0.3 0 -4.2">
          <a-cylinder position="0 1.3 0" radius="0.55" height="1.9" color="#1E6FA8" metalness="0.35" roughness="0.5"></a-cylinder>
          <a-cylinder position="0 2.28 0" radius="0.5" height="0.12" color="#144E78"></a-cylinder>
          <a-cylinder position="0 0.85 0" radius="0.57" height="0.12" color="#0D3B5C"></a-cylinder>
        </a-entity>

        <a-entity id="tuberia-principal">
          <a-cylinder position="-1.4 2.1 -3.85" rotation="0 0 90" radius="0.07" height="1.4" color="#D35400"></a-cylinder>
          <a-cylinder position="-0.3 1.6 -4.2" rotation="0 0 0" radius="0.07" height="1" color="#D35400"></a-cylinder>
          <a-cylinder position="-0.3 0.35 -3.0" rotation="90 0 0" radius="0.07" height="1.6" color="#D35400"></a-cylinder>
          <a-box position="-1.4 1.75 -3.85" width="0.12" height="0.35" depth="0.12" color="#3A3A3A"></a-box>
          <a-box position="-0.3 0.4 -3.75" width="0.12" height="0.35" depth="0.12" color="#3A3A3A"></a-box>
        </a-entity>

        <a-entity id="estacion-bombeo" position="-0.3 0 -2.2">
          <a-box position="0 0.25 0" width="0.7" height="0.5" depth="0.5" color="#4A4A4A" metalness="0.5" roughness="0.4"></a-box>
          <a-cylinder position="0 0.65 0" rotation="0 0 90" radius="0.22" height="0.6" color="#2E86C1"></a-cylinder>
          <a-sphere position="0.3 0.65 0" radius="0.05" color="#1B4F72"></a-sphere>
          <a-sphere position="-0.3 0.65 0" radius="0.05" color="#1B4F72"></a-sphere>
        </a-entity>

        <a-entity id="rack-metalico" position="2.7 0 -3">
          <a-box position="-0.6 1.5 0" width="0.12" height="3" depth="0.12" color="#3A3A3A" metalness="0.6" roughness="0.35"></a-box>
          <a-box position="0.6 1.5 0" width="0.12" height="3" depth="0.12" color="#3A3A3A" metalness="0.6" roughness="0.35"></a-box>
          <a-box position="0 3.05 0" width="1.3" height="0.12" depth="0.12" color="#4A4A4A"></a-box>
          <a-box position="0 0.8 0" width="1.2" height="0.06" depth="0.5" color="#5D6D7E"></a-box>
          <a-box position="0 1.8 0" width="1.2" height="0.06" depth="0.5" color="#5D6D7E"></a-box>
          <a-box position="0 2.6 0" width="1.2" height="0.06" depth="0.5" color="#5D6D7E"></a-box>
          <a-box position="-0.3 0.95 0" width="0.35" height="0.3" depth="0.35" color="#CB4335"></a-box>
          <a-box position="0.25 0.98 0.05" width="0.3" height="0.35" depth="0.3" color="#F1C40F"></a-box>
          <a-cylinder position="-0.15 1.95 0" radius="0.15" height="0.3" color="#7D6608"></a-cylinder>
        </a-entity>

        <a-entity id="pasarela" position="1.3 2.6 -3.5">
          <a-box position="0 0 0" width="2.4" height="0.08" depth="0.8" color="#707B7C"></a-box>
          <a-box position="0 0.45 0.38" width="2.4" height="0.05" depth="0.03" color="#FFC400"></a-box>
          <a-box position="0 0.45 -0.38" width="2.4" height="0.05" depth="0.03" color="#FFC400"></a-box>
          <a-box position="-1.15 0.22 0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-box position="0 0.22 0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-box position="1.15 0.22 0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-box position="-1.15 0.22 -0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-box position="0 0.22 -0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-box position="1.15 0.22 -0.38" width="0.03" height="0.5" depth="0.03" color="#4A4A4A"></a-box>
          <a-cylinder position="-1.0 -1.3 0" radius="0.05" height="2.6" color="#4A4A4A"></a-cylinder>
          <a-cylinder position="1.0 -1.3 0" radius="0.05" height="2.6" color="#4A4A4A"></a-cylinder>
        </a-entity>

        <a-entity id="panel-control" position="2.2 0 -1.2">
          <a-box position="0 0.9 0" width="0.6" height="1.1" depth="0.25" color="#34495E" metalness="0.4" roughness="0.5"></a-box>
          <a-box position="0 1.25 0.13" width="0.5" height="0.35" depth="0.02" color="#1B2631"></a-box>
          <a-sphere position="-0.15 0.75 0.14" radius="0.035" color="#2ECC71" emissive="#2ECC71" emissive-intensity="0.6"
            animation="property: material.emissiveIntensity; from: 0.6; to: 0.15; dur: 900; dir: alternate; loop: true"></a-sphere>
          <a-sphere position="0 0.75 0.14" radius="0.035" color="#F1C40F" emissive="#F1C40F" emissive-intensity="0.6"></a-sphere>
          <a-sphere position="0.15 0.75 0.14" radius="0.035" color="#E74C3C" emissive="#E74C3C" emissive-intensity="0.6"
            animation="property: material.emissiveIntensity; from: 0.6; to: 0.1; dur: 600; dir: alternate; loop: true"></a-sphere>
          <a-cylinder position="-0.1 0.6 0.14" rotation="90 0 0" radius="0.03" height="0.03" color="#7F8C8D"></a-cylinder>
          <a-cylinder position="0.1 0.6 0.14" rotation="90 0 0" radius="0.03" height="0.03" color="#7F8C8D"></a-cylinder>
        </a-entity>

        <a-sphere
          id="baliza"
          position="-2.5 4.05 -3.5"
          radius="0.12"
          color="#E74C3C"
          emissive="#E74C3C"
          emissive-intensity="0.8"
          animation="property: material.emissiveIntensity; from: 0.9; to: 0.2; dur: 500; dir: alternate; loop: true">
        </a-sphere>

      </a-entity>

      <!-- ==================== VISTA 3: PARTE D - MODELO CAD (engranaje GLB) ==================== -->
      <a-entity id="vista-parted" visible="false">
        <a-sky color="#1C1C1C"></a-sky>
        <a-plane rotation="-90 0 0" width="10" height="10" color="#2E2E2E"></a-plane>
        <a-entity light="type: point; intensity: 0.6; color: #FFFFFF; distance: 6" position="0 3 0"></a-entity>

        <!-- Engranaje: SolidWorks -> STL -> Blender (reducción de polígonos) -> GLB -->
        <a-entity
          gltf-model="url(models/gear.glb)"
          position="0 1.3 -3"
          rotation="90 0 0"
          scale="0.15 0.15 0.15"
          animation="property: rotation; to: 90 0 360; loop: true; dur: 6000; easing: linear">
        </a-entity>
      </a-entity>

      <!-- ==================== CÁMARA / CONTROLES ==================== -->
      <a-entity
        camera
        look-controls
        wasd-controls
        position="0 1.6 3">
      </a-entity>

    </a-scene>

    <script>
      function mostrarVista(vista) {
        var vistas = { demo: 'vista-demo', partec: 'vista-partec', parted: 'vista-parted' };
        var botones = { demo: 'btn-demo', partec: 'btn-partec', parted: 'btn-parted' };

        Object.keys(vistas).forEach(function (key) {
          var entidad = document.getElementById(vistas[key]);
          var boton = document.getElementById(botones[key]);
          var activa = key === vista;
          entidad.setAttribute('visible', activa);
          boton.classList.toggle('activo', activa);
        });
      }
    </script>

  </body>
</html>
