<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Industrial Lab - Parte C</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #CFE8F5">

      <!-- ==================== ILUMINACIÓN ==================== -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="2 4 2"></a-entity>

      <!-- ==================== PISO Y PAREDES ==================== -->
      <a-entity id="estructura-base">
        <!-- Piso -->
        <a-plane
          position="0 0 0"
          rotation="-90 0 0"
          width="12"
          height="12"
          color="#7D7D7D"
          material="roughness: 0.9">
        </a-plane>

        <!-- Pared trasera -->
        <a-plane
          position="0 2.5 -6"
          rotation="0 0 0"
          width="12"
          height="5"
          color="#B0C4DE">
        </a-plane>

        <!-- Pared lateral -->
        <a-plane
          position="-6 2.5 0"
          rotation="0 90 0"
          width="12"
          height="5"
          color="#B0C4DE">
        </a-plane>
      </a-entity>

      <!-- ==================== ESTRUCTURA METÁLICA (a-box) ==================== -->
      <!-- Jerarquía: la estructura padre agrupa columnas y viga -->
      <a-entity id="estructura-metalica" position="-3 0 -2">
        <a-box
          class="columna"
          position="0 1.5 0"
          width="0.3"
          height="3"
          depth="0.3"
          color="#4A4A4A"
          metalness="0.6"
          roughness="0.4">
        </a-box>
        <a-box
          class="columna"
          position="2 1.5 0"
          width="0.3"
          height="3"
          depth="0.3"
          color="#4A4A4A"
          metalness="0.6"
          roughness="0.4">
        </a-box>
        <a-box
          class="viga"
          position="1 3 0"
          width="2.3"
          height="0.25"
          depth="0.3"
          color="#606060"
          metalness="0.6"
          roughness="0.4">
        </a-box>
      </a-entity>

      <!-- ==================== TANQUE INDUSTRIAL (a-cylinder) ==================== -->
      <!-- Jerarquía: el tanque agrupa el cuerpo, tapa y eje interno -->
      <a-entity id="tanque-industrial" position="1.5 0 -2">
        <a-cylinder
          class="cuerpo-tanque"
          position="0 1 0"
          radius="0.8"
          height="2"
          color="#1E88E5"
          metalness="0.3"
          roughness="0.5">
        </a-cylinder>
        <a-cylinder
          class="tapa-tanque"
          position="0 2.05 0"
          radius="0.85"
          height="0.1"
          color="#0D47A1">
        </a-cylinder>
        <!-- Eje interno (representa un agitador o eje mecánico) -->
        <a-cylinder
          class="eje"
          position="0 1 0"
          radius="0.05"
          height="2.3"
          color="#FFC107">
        </a-cylinder>
      </a-entity>

      <!-- ==================== TUBERÍA (a-cylinder escalado y rotado) ==================== -->
      <a-cylinder
        id="tuberia"
        position="0 1 -2"
        rotation="0 0 90"
        radius="0.08"
        height="1.5"
        color="#FF7043">
      </a-cylinder>

      <!-- ==================== INDICADORES / SENSORES (a-sphere) ==================== -->
      <!-- Jerarquía: los sensores están anclados sobre el tanque -->
      <a-entity id="panel-sensores" position="1.5 2.3 -2">
        <a-sphere
          class="sensor sensor-ok"
          position="-0.3 0 0.85"
          radius="0.08"
          color="#2ECC71"
          emissive="#2ECC71"
          emissive-intensity="0.4">
        </a-sphere>
        <a-sphere
          class="sensor sensor-alerta"
          position="0 0 0.85"
          radius="0.08"
          color="#F1C40F"
          emissive="#F1C40F"
          emissive-intensity="0.4">
        </a-sphere>
        <a-sphere
          class="sensor sensor-critico"
          position="0.3 0 0.85"
          radius="0.08"
          color="#E74C3C"
          emissive="#E74C3C"
          emissive-intensity="0.4">
        </a-sphere>
      </a-entity>

      <!-- ==================== CÁMARA / CONTROLES ==================== -->
      <a-entity
        camera
        look-controls
        wasd-controls
        position="0 1.6 4">
      </a-entity>

    </a-scene>
  </body>
</html>
